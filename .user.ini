; Allow individual uploads up to 500 MB. The POST limit includes multipart
; form metadata, so keep a little headroom above the per-file limit.
upload_max_filesize = 500M
post_max_size = 510M
; Large evidence files may take several minutes to arrive on slower connections.
max_input_time = 3600
max_execution_time = 600
; PHP's pre-request upload warnings must be logged rather than corrupting JSON.
display_errors = Off
log_errors = On
